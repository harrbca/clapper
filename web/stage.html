<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clapper</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/@kit/stage.css">
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="canvas"></canvas><div id="overlay"></div></div></div>
<div id="ui">
  <button id="play" title="Play or pause (Space)">Play</button>
  <input id="seek" type="range" min="0" step="0.001" value="0" aria-label="Position">
  <span id="clock">0:00.00</span>
  <select id="scenes" aria-label="Jump to scene"></select>
  <select id="rate" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option></select>
  <label title="Loop the current scene"><input id="loop" type="checkbox"> Loop</label>
  <label title="Show cues and the current line (D)"><input id="debug" type="checkbox"> Cues</label>
  <button id="note" class="quiet" type="button" title="Write a note on this frame (N)">Note</button>
  <a id="stills" href="/@kit/stills.html" target="_blank" title="The renders in out/: stills, sheets and frames, as they're made">Stills</a>
</div>
<form id="notebox" hidden>
  <span id="notewhere"></span>
  <input id="notetext" autocomplete="off" placeholder="What should change here?" aria-label="The note">
  <button type="submit">Save</button>
  <button id="notecancel" class="quiet" type="button">Cancel</button>
</form>
<div id="hud" hidden></div>
<div id="banner" hidden></div>
<audio id="audio" preload="auto"></audio>
<script type="importmap">{ "imports": {
  "three": "/@kit/three/build/three.module.js",
  "three/addons/": "/@kit/three/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/+esm": "/@kit/opentype/opentype.module.js"
} }</script>
<script type="module" src="/@kit/stage.js"></script>
</body>
</html>
